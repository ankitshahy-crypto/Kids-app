name: Voice clips (Google)

# Makes the app's spoken clips with Google Cloud Text-to-Speech on GitHub's
# machines, then pushes a branch and opens a pull request with the MP3s.
# Needs the GOOGLE_TTS_KEY repository secret: the contents of a service
# account JSON key for a project with the Text-to-Speech API enabled. The
# app never calls Google; it only plays the files. Run it from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Main voice (en-US Chirp3-HD, Chirp-HD, Studio, or Neural2 name)"
        default: en-US-Chirp3-HD-Aoede
      letter_style:
        description: "Letter phrases say the sound (via an SSML voice) or the name (bee, as in ball)"
        default: sound
      letter_voice:
        description: "Voice for letter sounds; must support SSML (Neural2 or Studio)"
        default: en-US-Neural2-F
      speed:
        description: "Speaking rate (1 is normal)"
        default: "0.95"
      force:
        description: "Remake clips that already exist (true/false)"
        default: "true"

permissions:
  contents: write
  pull-requests: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Write the key
        run: |
          if [ -z "${{ secrets.GOOGLE_TTS_KEY }}" ]; then
            echo "The GOOGLE_TTS_KEY repository secret is not set." >&2
            exit 1
          fi
          printf '%s' '${{ secrets.GOOGLE_TTS_KEY }}' > "$RUNNER_TEMP/google-tts-key.json"

      - name: Make clips
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-tts-key.json
        run: |
          node scripts/generate-audio.mjs \
            --voice "${{ inputs.voice }}" \
            --letter-voice "${{ inputs.letter_voice }}" \
            --letter-style "${{ inputs.letter_style }}" \
            --speed "${{ inputs.speed }}" \
            $([ "${{ inputs.force }}" = "true" ] && echo --force)

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/google-tts-key.json"

      - name: Summary
        run: |
          echo "### Voice clips (Google)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voice: ${{ inputs.voice }}, letters as ${{ inputs.letter_style }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Files: $(find public/audio -name '*.mp3' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -sh public/audio | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: voice/google-${{ inputs.voice }}
          title: "Voice clips: ${{ inputs.voice }}, letters as ${{ inputs.letter_style }}"
          commit-message: |
            Add spoken clips made with Google Cloud Text-to-Speech (${{ inputs.voice }}).

            Generated offline by scripts/generate-audio.mjs. The app plays these
            files and never calls a voice service.
          body: |
            Spoken clips for every line in `src/data/audioManifest.json`, made with Google Cloud Text-to-Speech on GitHub's machines.

            - Voice: `${{ inputs.voice }}`, speed `${{ inputs.speed }}`, letter phrases as `${{ inputs.letter_style }}`${{ inputs.letter_style == 'sound' && format(' via `{0}`', inputs.letter_voice) || '' }}
            - The app plays these files offline. It never contacts a voice service.
            - `src/data/audioAvailable.json` lists every file so the app knows what it has.

            Listen on a phone before merging: a few letter phrases, a few words, a story page.
          labels: audio
          delete-branch: true
