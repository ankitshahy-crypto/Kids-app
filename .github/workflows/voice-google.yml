name: Voice clips (Google)

# Makes the app's spoken clips with Google Cloud Text-to-Speech on GitHub's
# machines, then pushes a branch and opens a pull request with the MP3s.
# Needs the GOOGLE_TTS_API_KEY repository secret: an API key from a project
# with the Text-to-Speech API enabled, restricted to that API. The app never
# calls Google; it only plays the files. Run it from the Actions tab.
#
# Letter phrases ("m, as in moon") and bare letter sounds ("mmm", for
# sounding out a word) are made with SSML phonemes, which the Chirp 3 HD
# voices take. With a Gemini model, those two kinds still come from the
# Chirp 3 HD voice of the same name.

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voice: a Chirp 3 HD / Gemini name (Aoede, Kore, Leda, Zephyr, Sulafat...) or a full Google voice name"
        default: Aoede
      model:
        description: "Model"
        type: choice
        default: chirp3
        options:
          - chirp3
          - gemini-2.5-pro-tts
          - gemini-2.5-flash-tts
          - gemini-3.1-flash-tts-preview
      prompt:
        description: "Style prompt for the Gemini models (blank = the script's calm-teacher prompt)"
        default: ""
      letter_style:
        description: "Letter phrases say the sound (mmm, as in moon) or the name (em, as in moon)"
        type: choice
        default: sound
        options:
          - sound
          - name
      letter_voice:
        description: "Voice for letter phrases and sounds (blank = the same voice, as Chirp 3 HD)"
        default: ""
      speed:
        description: "Speaking rate (1 is normal; Chirp 3 HD, Neural2, Studio only)"
        default: "0.95"
      only:
        description: "Only these kinds, comma-separated (blank = all): letters,sounds,words,sentences,numbers,prompts,colors,stories"
        default: ""
      force:
        description: "Remake clips that already exist: true, false, or kinds to remake (letters,sounds)"
        default: "true"

permissions:
  contents: write
  pull-requests: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the key
        run: |
          if [ -z "${{ secrets.GOOGLE_TTS_API_KEY }}" ]; then
            echo "The GOOGLE_TTS_API_KEY repository secret is not set." >&2
            exit 1
          fi

      - name: Make clips
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VOICE: ${{ inputs.voice }}
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ inputs.prompt }}
          LETTER_STYLE: ${{ inputs.letter_style }}
          LETTER_VOICE: ${{ inputs.letter_voice }}
          SPEED: ${{ inputs.speed }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--voice "$VOICE" --model "$MODEL" --letter-style "$LETTER_STYLE" --speed "$SPEED")
          [ -n "$PROMPT" ] && args+=(--prompt "$PROMPT")
          [ -n "$LETTER_VOICE" ] && args+=(--letter-voice "$LETTER_VOICE")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          case "$FORCE" in
            true) args+=(--force) ;;
            false|"") ;;
            *) args+=(--force "$FORCE") ;;
          esac
          node scripts/generate-audio.mjs "${args[@]}"

      - name: Summary
        run: |
          echo "### Voice clips (Google)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voice: ${{ inputs.voice }} (${{ inputs.model }}), letters as ${{ inputs.letter_style }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Files: $(find public/audio -name '*.mp3' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -sh public/audio | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: voice/google-${{ inputs.model }}-${{ inputs.voice }}
          title: "Voice clips: ${{ inputs.voice }} (${{ inputs.model }}), letters as ${{ inputs.letter_style }}"
          commit-message: |
            Add spoken clips made with Google Cloud Text-to-Speech (${{ inputs.voice }}, ${{ inputs.model }}).

            Generated offline by scripts/generate-audio.mjs. The app plays these
            files and never calls a voice service.
          body: |
            Spoken clips for `src/data/audioManifest.json`${{ inputs.only != '' && format(' (kinds: `{0}`)', inputs.only) || '' }}, made with Google Cloud Text-to-Speech on GitHub's machines.

            - Voice: `${{ inputs.voice }}`, model `${{ inputs.model }}`, speed `${{ inputs.speed }}`, letter phrases as `${{ inputs.letter_style }}`${{ inputs.letter_voice != '' && format(' via `{0}`', inputs.letter_voice) || '' }}
            - The app plays these files offline. It never contacts a voice service.
            - `src/data/audioAvailable.json` lists every file so the app knows what it has.

            Listen on a phone before merging: a few letter phrases, a sounded-out word, a story page.
          labels: audio
          delete-branch: true
