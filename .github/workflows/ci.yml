name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Explore import guard
        run: node --experimental-strip-types scripts/check-explore-imports.mjs

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /Kids-app/

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright Chromium
        run: npx playwright test --project=chromium

      # A timed-out test says only that it ran out of time, and how close the others came is
      # one line each among hundreds in the log. This lists the slowest tests on the run's
      # summary, and warns about any that passed close to the limit, so a test creeping toward
      # 30 s is seen before it fails. It runs after a failure too, and cannot fail the build.
      - name: Slowest browser tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/slowest-tests.mjs

      # The public demo's build: locked like the app, with the App Store as the way in.
      - name: Build the locked web demo
        run: npm run build
        env:
          VITE_BASE: /Kids-app/
          VITE_WEB_LOCK: "1"

      - name: Playwright, locked web demo
        run: npx playwright test -c playwright.locked.config.ts
        env:
          EXPECT_WEB_LOCK: "1"
