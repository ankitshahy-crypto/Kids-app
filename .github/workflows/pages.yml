name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/profile-daily-lesson-df76
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the main demo
        env:
          VITE_BASE: /Kids-app/
        run: |
          npm ci
          npm run build

      - name: Checkout the preview branch
        id: preview
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: preview
          path: preview-src

      - name: Build the preview
        if: steps.preview.outcome == 'success'
        working-directory: preview-src
        env:
          VITE_BASE: /Kids-app/preview/
        run: |
          npm ci
          npm run build

      - name: Keep /preview/ next to the main demo
        if: steps.preview.outcome == 'success'
        run: |
          mkdir -p dist/preview
          cp -a preview-src/dist/. dist/preview/
          test -f dist/index.html
          test -f dist/preview/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
