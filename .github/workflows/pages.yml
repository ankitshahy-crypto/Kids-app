name: Deploy GitHub Pages

# The site is built from main only after CI has passed on that commit: a red push to main does not
# deploy. (It used to deploy on every push, so a commit that broke a test could still go live.)
# The workflow can also be run by hand from the Actions tab, for the commit the branch is at.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Production only. The preview branch must not deploy this environment:
# a second deploy-pages job would replace the live site.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    # A CI run of a push to main, and a green one. (CI also runs on pull requests; those never deploy.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit CI passed on, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /Kids-app/
          # The public demo is locked like the app: weeks 1–2 free, the App Store for the rest.
          VITE_WEB_LOCK: "1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
