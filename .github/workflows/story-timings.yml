name: Story word timings

# Times every word in the recorded story pages, so the reader can light each
# word as the narrator reads it. A speech recognizer (faster-whisper) listens
# to the clips on GitHub's machines, in eight parts at once; the app only
# reads the resulting JSON. Run it after story clips change (Voice clips with
# `stories`), from the Actions tab. It opens a pull request with
# src/data/storyTimings.json.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only clips whose id starts with this (blank = every story page)"
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install
        run: |
          command -v ffmpeg >/dev/null || sudo apt-get install -y -q ffmpeg
          pip install -q faster-whisper

      - name: Check the matching
        run: python3 scripts/story-timings.py --self-test

      - name: Time this part
        env:
          ONLY: ${{ inputs.only }}
          SHARD: ${{ matrix.shard }}
        # A part that fails says why, as an error on the run. It used to pass in silence (the pipe to
        # tee hid the exit code), and the only sign was the join step failing a minute later.
        run: |
          set -o pipefail
          args=(--shard "$SHARD/8" --out "part-$SHARD.json")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if ! python3 scripts/story-timings.py "${args[@]}" 2>&1 | tee "part-$SHARD.log"; then
            tail -n 8 "part-$SHARD.log" | sed 's/^/::error::/'
            exit 1
          fi

      - name: Keep this part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: |
            part-${{ matrix.shard }}.json
            part-${{ matrix.shard }}.log
          if-no-files-found: ignore

  join:
    needs: time
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Collect the parts
        uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true

      - name: Join
        id: join
        run: |
          set -o pipefail
          python3 scripts/story-timings.py --merge parts/part-*.json | tee joined.log
          {
            echo "### Story word timings"
            echo
            cat joined.log
            echo
            grep -h -A 40 "fewer than 3 in 4" parts/part-*.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "report<<TIMED"
            cat joined.log
            grep -h "clips where fewer" parts/part-*.log || true
            echo "TIMED"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: story/timings
          add-paths: src/data/storyTimings.json
          title: "Story word timings"
          commit-message: |
            Time every word in the recorded story pages.

            Made by scripts/story-timings.py with faster-whisper on GitHub's
            machines. The app reads the times; it never runs a recognizer.

            ${{ steps.join.outputs.report }}
          body: |
            When each word starts in every recorded story page, for the reader's follow-along highlight.

            ```
            ${{ steps.join.outputs.report }}
            ```

            Open a story on a phone and watch a few pages before merging: each word should light as it is said.
          delete-branch: true
