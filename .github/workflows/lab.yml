name: Lab

# The measuring bench. It runs only for branches named lab/..., which are never merged: a push
# there measures the app in WebKit at an iPad's sizes and prints what it found as notices.
on:
  push:
    branches:
      - "lab/**"

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loads:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The start screen, loaded many times, two at once
        continue-on-error: true
        run: npx playwright test -c playwright.lab.config.ts e2e/zz-loads-lab.spec.ts --project=cr-iphone --workers=2 --repeat-each=12
      - name: What was seen (1)
        if: ${{ !cancelled() }}
        run: node scripts/lab-notes.mjs --slice=0
      - name: What was seen (2)
        if: ${{ !cancelled() }}
        run: node scripts/lab-notes.mjs --slice=1
