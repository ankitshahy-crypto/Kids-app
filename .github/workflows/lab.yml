name: Lab

# The measuring bench. It runs only for branches named lab/..., which are never merged: a push
# there measures the app and prints what it found as notices.
on:
  push:
    branches:
      - "lab/**"

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The polish pass made the WebKit run half as long again (18 to 27 minutes, two tests over
  # their limit). Every browser test in WebKit at an iPhone's size, once with the polish whole,
  # once with each piece of it taken out, once with all of them out: the piece that costs the
  # time shows as the variant that runs quick (scripts/lab-polish-variant.py).
  # The polish pass's cost in WebKit, measured three times each so the runners' own variance can be
  # told from the CSS: the polish whole, with no transition on buttons, and with every piece out.
  # The tap-heavy specs only, so a run is short. scripts/lab-polish-variant.py applies the variant.
  polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [full, none, nosurface, noshadow, noblob, nofade]
        turn: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: The polish, ${{ matrix.variant }}
        run: python3 scripts/lab-polish-variant.py ${{ matrix.variant }}
      - name: Playwright WebKit, iPhone, ${{ matrix.variant }} (${{ matrix.turn }})
        continue-on-error: true
        run: npx playwright test --project=iphone --retries=0 e2e/build-it.spec.ts e2e/games.spec.ts e2e/press.spec.ts e2e/story.spec.ts e2e/think-code.spec.ts e2e/comfort.spec.ts
      - name: What was seen
        if: ${{ !cancelled() }}
        run: node scripts/lab-notes.mjs --slice=0
