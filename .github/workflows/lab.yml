name: Lab

# The measuring bench. It runs only for branches named lab/..., which are never merged: a push
# there measures the app in WebKit at an iPad's sizes and prints what it found as notices.
on:
  push:
    branches:
      - "lab/**"

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - name: Take me home, round by round, in both engines
        continue-on-error: true
        run: npx playwright test -c playwright.lab.config.ts e2e/zz-bird-lab.spec.ts --workers=2
      - name: What was measured (1)
        if: ${{ !cancelled() }}
        run: node scripts/lab-notes.mjs --slice=0
      - name: What was measured (2)
        if: ${{ !cancelled() }}
        run: node scripts/lab-notes.mjs --slice=1
      - name: What was measured (3)
        if: ${{ !cancelled() }}
        run: node scripts/lab-notes.mjs --slice=2
      - name: What was measured (4)
        if: ${{ !cancelled() }}
        run: node scripts/lab-notes.mjs --slice=3
