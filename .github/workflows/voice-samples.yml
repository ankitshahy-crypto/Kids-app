name: Voice samples (Google)

# Makes one short comparison clip per voice (two letter phrases, a sounded-out
# word, two words, two prompts, two story lines) so a person can pick the
# app's voice by ear, and pushes them to the voice-samples branch. Nothing
# under public/audio changes. Needs the GOOGLE_TTS_API_KEY secret.

on:
  workflow_dispatch:
    inputs:
      voices:
        description: "Comma-separated model:voice pairs (chirp3 voices are free; the Gemini models cost a few cents)"
        default: "chirp3:Aoede,chirp3:Kore,chirp3:Leda,chirp3:Zephyr,chirp3:Sulafat,gemini-2.5-pro-tts:Aoede,gemini-2.5-pro-tts:Kore,gemini-2.5-flash-tts:Aoede"
      prompt:
        description: "Style prompt for the Gemini models (blank = the script's calm-teacher prompt)"
        default: ""
      speed:
        description: "Speaking rate for the Chirp 3 HD voices (1 is normal)"
        default: "0.95"
      tries:
        description: "Experiments, one per line: label=text or label=<speak>ssml</speak>, made in the first voice listed instead of the samples"
        default: ""

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          command -v ffmpeg >/dev/null || sudo apt-get install -y -q ffmpeg
          ffmpeg -version | head -n 1

      - name: Check the key
        run: |
          if [ -z "${{ secrets.GOOGLE_TTS_API_KEY }}" ]; then
            echo "The GOOGLE_TTS_API_KEY repository secret is not set." >&2
            exit 1
          fi

      - name: Make sample clips
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VOICES: ${{ inputs.voices }}
          PROMPT: ${{ inputs.prompt }}
          SPEED: ${{ inputs.speed }}
          TRIES: ${{ inputs.tries }}
        run: |
          args=(--sample "$VOICES" --sample-dir samples --speed "$SPEED" --force)
          [ -n "$PROMPT" ] && args+=(--prompt "$PROMPT")
          if [ -n "$TRIES" ]; then
            printf '%s\n' "$TRIES" > tries.txt
            first="${VOICES%%,*}"
            model=chirp3; [ "${first%%:*}" != "$first" ] && model="${first%%:*}"
            args=(--voice "${first#*:}" --model "$model" --try tries.txt --sample-dir samples --speed "$SPEED")
          fi
          # Errors become annotations, which can be read without the full log.
          if ! node scripts/generate-audio.mjs "${args[@]}" 2>&1 | tee make.log; then
            tail -n 5 make.log | sed 's/^/::error::/'
            exit 1
          fi
          grep -h . samples/*.error.txt 2>/dev/null | sed 's/^/::warning::/' || true

      - name: Join each voice into one clip
        continue-on-error: true
        run: |
          for dir in samples/*/; do
            if ! node scripts/join-audio.mjs "${dir%/}" 2>&1 | tee join.log; then
              echo "::error::join failed for $dir: $(tail -n 3 join.log | tr '\n' ' ')"
            fi
          done
          ls -la samples

      - name: Listen with a speech recognizer
        continue-on-error: true
        run: |
          pip install -q faster-whisper
          python3 scripts/hear-clips.py samples/*/ > heard.md
          cat heard.md

      - name: Push the voice-samples branch
        env:
          VOICES: ${{ inputs.voices }}
          PROMPT: ${{ inputs.prompt }}
          SPEED: ${{ inputs.speed }}
        run: |
          out=$(mktemp -d)
          [ -s heard.md ] && cp heard.md "$out/heard.md"
          cp samples/*.mp3 "$out"/ 2>/dev/null || true
          cp samples/*.error.txt "$out"/ 2>/dev/null || true
          # The separate parts too, in case a joined clip is missing.
          for dir in samples/*/; do
            mkdir -p "$out/parts/$(basename "$dir")" && cp "$dir"*.mp3 "$out/parts/$(basename "$dir")/" 2>/dev/null || true
          done
          {
            echo "# Voice samples"
            echo
            echo "Made by the \"Voice samples (Google)\" workflow on $(date -u +%Y-%m-%d). Each clip says, in this order:"
            echo "two letter phrases (m, s), three bare letter sounds (m, a, t), two words (mat, sun), two prompts, and two story lines."
            echo
            echo "- Voices: \`$VOICES\`"
            echo "- Chirp 3 HD speed: \`$SPEED\`"
            [ -n "$PROMPT" ] && echo "- Gemini prompt: $PROMPT"
            echo
            for f in "$out"/*.mp3; do
              [ -e "$f" ] || continue
              echo "- $(basename "$f"): $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | cut -c1-4) s"
            done
            for f in "$out"/*.error.txt; do
              [ -e "$f" ] || continue
              echo "- $(basename "$f" .error.txt): failed: $(cat "$f")"
            done
            if [ -s "$out/heard.md" ]; then
              echo
              echo "## What a speech recognizer heard"
              echo
              echo "Isolated sounds are hard for a recognizer; a blank or odd line means listen to that one."
              echo
              cat "$out/heard.md"
            fi
          } > "$out/README.md"
          cd "$out"
          git init -q
          git checkout -q -b voice-samples
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Voice samples: $VOICES"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-samples
          echo "### Voice samples" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat README.md >> "$GITHUB_STEP_SUMMARY"
